# ~/deploy/docker-compose.yml on the EC2 server
services:
  web:
    image: ghcr.io/marrazy/arrazy-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  backend:
    image: ghcr.io/marrazy/arrazy-backend:latest
    env_file: backend.env 
    volumes:
      - data:/data #=
    restart: unless-stopped


volumes:
  data:
